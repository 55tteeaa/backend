services:
  db:
    image: postgres:16-alpine
    container_name: campus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: usv_admin
      POSTGRES_PASSWORD: usv_secret_password
      POSTGRES_DB: campus_cercetare
    ports:
      - "5432:5432"
    volumes:
      - campus_pgdata:/var/lib/postgresql/data
    networks:
      - campus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usv_admin -d campus_cercetare"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: campus_api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:z
      - ./prisma:/app/prisma:z
    networks:
      - campus-net

volumes:
  campus_pgdata:

networks:
  campus-net:
    external: true
    name: campus-cercetare-net
